{% extends "layout.html" %}
{% block main_content %}
<section class="pf-grid">
  {% for project in projects %}
  <article class="pf-card">
    <a class="pf-card__media" href="{{ url_for('portfolio.detail', slug=project.slug) }}">
      <img src="{{ project.image }}" alt="" loading="lazy" />
    </a>
    <p class="pf-card__category">{{ project.category }}</p>
    <h2 class="pf-card__title">
      <a href="{{ url_for('portfolio.detail', slug=project.slug) }}">{{ project.title }}</a>
    </h2>
  </article>
  {% endfor %}
</section>
{% endblock %}
