<nav class="ht-week" aria-label="Select a date">
  {% for day in week %}
  <a
    class="ht-week__day {% if day.iso == selected_date %}ht-week__day--active{% endif %}"
    href="{{ url_for('habit_tracker.index', date=day.iso) }}"
    >{{ day.label }} {{ day.day_number }}</a
  >
  {% endfor %}
</nav>
