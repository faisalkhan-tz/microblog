<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ title }}</title>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&display=swap"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('habit_tracker.static', filename='habit_tracker.css') }}" />
  </head>
  <body>
    <div class="page">
      <header class="ht-header">
        <div class="ht-wordmark">
          <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
            <path d="M4 11.5 9 16 18 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
          <span class="ht-wordmark__text">Habits</span>
        </div>
        <nav class="ht-tabs" aria-label="Apps">
          <a class="active" href="{{ url_for('habit_tracker.index') }}">Habits</a>
          <a href="{{ url_for('microblog.index') }}">Feed</a>
        </nav>
        <a class="ht-header__add" href="{{ url_for('habit_tracker.add_habit') }}"
          >+ Add new</a
        >
      </header>
      {% block calendar %}{% endblock %}
      <main class="ht-main">{% block main_content %}{% endblock %}</main>
    </div>
  </body>
</html>
