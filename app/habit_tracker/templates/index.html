{% extends "layout.html" %}
{% block calendar %}{% include "_calendar.html" %}{% endblock %}
{% block main_content %}


<ul class="ht-list">
  {% for habit in habits %}
  <li class="ht-list__item">
    <form
      class="ht-list__form"
      action="{{ url_for('habit_tracker.toggle_habit', habit_id=habit._id) }}"
      method="post"
    >
      <input type="hidden" name="date" value="{{ selected_date }}" />
      <button
        type="submit"
        class="ht-checkbox {% if habit.done %}ht-checkbox--checked{% endif %}"
        aria-pressed="{{ 'true' if habit.done else 'false' }}"
        aria-label="Toggle {{ habit.name }} for {{ selected_date }}"
      ></button>
    </form>
    <span class="ht-list__name">{{ habit.name }}</span>
  </li>
  {% else %}
  <li class="ht-empty">No habits yet — add one to get started.</li>
  {% endfor %}
</ul>
{% endblock %}
